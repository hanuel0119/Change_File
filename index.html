<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바꿈 파일 변환기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 홈은 카테고리별 도구 목록, 도구 화면은 올리기 → 옵션 → 결과가 위에서 아래로 흐르는 한 줄 구성 */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --ink: #15171c;
  --muted: #5b6270;
  --line: #dcdfe6;
  --accent: #1f4fd8;
  --accent-ink: #ffffff;
  --accent-soft: #e6ecfc;
  --danger: #c2352a;
  --ok: #0f7a52;
  --c-image: #0f7a52;
  --c-pdf: #c2352a;
  --c-data: #a4660f;
  --c-audio: #7446c0;
  --c-video: #0b6f8a;
  --c-zip: #59606d;
  --c-3d: #b03a7a;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101217; --surface: #191c23; --ink: #e9ebf0; --muted: #9ba2af; --line: #2b2f39;
    --accent: #7d9dff; --accent-ink: #0d1430; --accent-soft: #1f2a4d; --danger: #ff8378; --ok: #4fd1a1;
    --c-image: #4fd1a1; --c-pdf: #ff8378; --c-data: #f0b65a; --c-audio: #b99aff; --c-video: #5cc8e6; --c-zip: #a5abb7; --c-3d: #ff8cc6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101217; --surface: #191c23; --ink: #e9ebf0; --muted: #9ba2af; --line: #2b2f39;
  --accent: #7d9dff; --accent-ink: #0d1430; --accent-soft: #1f2a4d; --danger: #ff8378; --ok: #4fd1a1;
  --c-image: #4fd1a1; --c-pdf: #ff8378; --c-data: #f0b65a; --c-audio: #b99aff; --c-video: #5cc8e6; --c-zip: #a5abb7; --c-3d: #ff8cc6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
header.top { border-bottom: 1px solid var(--line); background: var(--surface); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
.brand-mark { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-size: 13px; }
.safe { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.safe::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }

.hero { padding: 36px 0 12px; display: grid; gap: 16px; }
.hero h1 { margin: 0; font-size: clamp(26px, 4vw, 36px); line-height: 1.25; letter-spacing: -0.02em; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); max-width: 60ch; }
.search { position: relative; max-width: 460px; }
.search input { width: 100%; padding: 12px 14px 12px 40px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.quick span { color: var(--muted); font-size: 13px; margin-right: 4px; }
.quick a { text-decoration: none; font-family: var(--font-mono); font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.quick a:hover { border-color: var(--accent); color: var(--accent); }

.cat { padding: 22px 0 6px; }
.cat-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.cat-head h2 { margin: 0; font-size: 17px; }
.cat-head .count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.cat-head .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--cc); align-self: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tool-card { display: grid; gap: 6px; align-content: start; padding: 14px 16px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); transition: border-color .15s, transform .15s; }
.tool-card:hover { border-color: var(--cc); transform: translateY(-1px); }
.fmt { font-family: var(--font-mono); font-weight: 600; font-size: 14px; color: var(--cc); letter-spacing: 0.01em; }
.tool-card .t { font-weight: 700; font-size: 15px; }
.tool-card .d { color: var(--muted); font-size: 13px; line-height: 1.5; }
.empty-search { color: var(--muted); padding: 24px 0; display: none; }

footer { margin-top: 48px; border-top: 1px solid var(--line); padding: 20px 0 40px; color: var(--muted); font-size: 13px; }
footer .wrap { display: grid; gap: 6px; }

/* 도구 화면 */
.tool-view { padding: 24px 0 0; display: grid; gap: 18px; }
.back { text-decoration: none; color: var(--muted); font-size: 14px; width: fit-content; }
.back:hover { color: var(--accent); }
.tool-title { display: grid; gap: 4px; }
.tool-title h1 { margin: 0; font-size: clamp(22px, 3.4vw, 30px); letter-spacing: -0.02em; text-wrap: balance; }
.tool-title p { margin: 0; color: var(--muted); max-width: 65ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; }
.panel h3 { margin: 0; font-size: 14px; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.drop { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 30px 16px; text-align: center; cursor: pointer; display: grid; gap: 6px; justify-items: center; transition: border-color .15s, background .15s; background: var(--bg); }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { font-size: 16px; }
.drop span { color: var(--muted); font-size: 13px; }
.drop .accept { font-family: var(--font-mono); font-size: 12px; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.file { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; background: var(--surface); min-width: 0; }
.file.err { border-color: var(--danger); }
.file .meta { padding: 8px 10px; display: grid; gap: 2px; font-size: 13px; min-width: 0; }
.file .name { font-weight: 500; overflow-wrap: anywhere; line-height: 1.4; }
.file .size { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.file .row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.file .errmsg { color: var(--danger); font-size: 12.5px; }
.pv { aspect-ratio: 4 / 3; background: var(--bg); display: grid; place-items: center; overflow: hidden; position: relative; border-bottom: 1px solid var(--line); background-image: linear-gradient(45deg, rgba(127,127,127,.08) 25%, transparent 25%, transparent 75%, rgba(127,127,127,.08) 75%), linear-gradient(45deg, rgba(127,127,127,.08) 25%, transparent 25%, transparent 75%, rgba(127,127,127,.08) 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; }
.pv img, .pv canvas { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.pv video { width: 100%; height: 100%; object-fit: contain; background: #000; }
.pv audio { width: 92%; }
.pv pre { margin: 0; padding: 8px 10px; font-family: var(--font-mono); font-size: 11px; line-height: 1.45; width: 100%; height: 100%; overflow: hidden; white-space: pre-wrap; word-break: break-all; color: var(--ink); background: var(--surface); text-align: left; }
.pv table { border-collapse: collapse; font-size: 11px; background: var(--surface); width: 100%; align-self: start; font-variant-numeric: tabular-nums; }
.pv td, .pv th { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left; white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.pv th { font-weight: 700; background: var(--bg); }
.pv .ph { display: grid; justify-items: center; gap: 4px; color: var(--muted); font-size: 12px; text-align: center; padding: 8px; }
.pv .ph b { font-family: var(--font-mono); font-size: 20px; color: var(--ink); }
.pv .badge { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 999px; font-family: var(--font-mono); }
.pv ul { margin: 0; padding: 8px 10px 8px 24px; font-size: 11.5px; width: 100%; height: 100%; overflow: hidden; background: var(--surface); text-align: left; }

.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.opt { display: grid; gap: 6px; font-size: 14px; }
.opt > label, .opt > .lbl { font-weight: 500; }
.opt .hint { color: var(--muted); font-size: 12.5px; }
select, input[type="number"], input[type="text"], textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); width: 100%; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; font-family: var(--font-mono); font-size: 13px; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 11px 22px; font-size: 15px; }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.small { padding: 4px 9px; font-size: 12.5px; border-radius: 6px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.progress { display: none; gap: 6px; }
.progress.on { display: grid; }
.bar { height: 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.progress .lbl { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); }
.note.warn { color: var(--c-data); }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
.split textarea { min-height: 300px; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; resize: vertical; }
.split iframe { width: 100%; min-height: 300px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.pane { display: grid; gap: 8px; align-content: start; min-width: 0; }
.pane-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.pane-head select { width: auto; }
.errline { color: var(--danger); font-size: 13px; min-height: 1.2em; }
.tablewrap { overflow: auto; max-height: 300px; border: 1px solid var(--line); border-radius: 8px; }
.tablewrap table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tablewrap td, .tablewrap th { border-bottom: 1px solid var(--line); padding: 5px 10px; text-align: left; white-space: nowrap; }
.tablewrap th { background: var(--bg); position: sticky; top: 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 10px; }
.page { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); display: grid; }
.page.del { opacity: .4; }
.page.del .pv { filter: grayscale(1); }
.page .pv { aspect-ratio: 3 / 4; }
.page .pv canvas { transition: transform .2s; }
.page .ctrl { display: flex; justify-content: space-between; align-items: center; padding: 6px; gap: 4px; flex-wrap: wrap; }
.page .num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-left: 4px; }

.view3d { position: absolute; left: 6px; top: 6px; background: var(--surface); }
.viewer { position: relative; min-height: 0; background: radial-gradient(circle at 50% 40%, var(--surface), var(--bg)); border-radius: 8px; overflow: hidden; }
.viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.viewer.tall { height: min(62vh, 560px); border: 1px solid var(--line); }
.modal { position: fixed; inset: 0; background: rgba(8, 10, 14, .62); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: min(980px, 100%); height: min(720px, 100%); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
.modal-box .viewer { border-radius: 0; }
.modal-head, .modal-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; flex-wrap: wrap; }
.modal-head { border-bottom: 1px solid var(--line); }
.modal-head strong { overflow-wrap: anywhere; }
.modal-foot { border-top: 1px solid var(--line); }
.uv-split { grid-template-columns: 1fr 1fr; }
.uv-3d { height: min(56vh, 480px); border: 1px solid var(--line); }
.uv-wrap { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; aspect-ratio: 1; max-height: min(56vh, 480px); display: grid; place-items: center; background: var(--surface); }
.uv-canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.uv-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; background: var(--surface); }
.stat.warn { border-left-color: var(--c-data); }
.stat.bad { border-left-color: var(--danger); }
.stat .k { font-size: 12.5px; color: var(--muted); }
.stat .v { font-family: var(--font-mono); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat .h { font-size: 12px; color: var(--muted); line-height: 1.45; }
.actions select { width: auto; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); z-index: 10; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 480px) { .files { grid-template-columns: repeat(2, minmax(0, 1fr)); } .wrap { padding: 0 16px; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><span class="brand-mark">⇄</span>바꿈</a>
    <span class="safe">파일이 서버로 올라가지 않아요</span>
  </div>
</header>
<main id="app" class="wrap"></main>
<footer>
  <div class="wrap">
    <span>모든 변환은 지금 쓰는 브라우저 안에서 처리돼요. 파일은 이 기기 밖으로 나가지 않아요.</span>
    <span>영상은 컴퓨터 성능에 따라 시간이 걸려요. 300MB 이하 파일을 권장해요.</span>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ───────── 공통 도구 ───────── */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    el.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return el;
}
const extOf = n => { const i = n.lastIndexOf("."); return i < 0 ? "" : n.slice(i + 1).toLowerCase(); };
const baseOf = n => n.replace(/\.[^./]+$/, "");
const fmtSize = b => b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(1) + " KB" : (b / 1048576).toFixed(1) + " MB";
const sleep = ms => new Promise(r => setTimeout(r, ms));
let urls = [];
const objUrl = b => { const u = URL.createObjectURL(b); urls.push(u); return u; };
function revokeAll() { urls.forEach(u => URL.revokeObjectURL(u)); urls = []; }
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 3200); }

const loaded = {};
function loadScript(src) {
  return loaded[src] || (loaded[src] = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res;
    s.onerror = () => { delete loaded[src]; rej(new Error("필요한 파일(" + src.split("/").pop() + ")을 불러오지 못했어요. 새로고침해 주세요.")); };
    document.head.appendChild(s);
  }));
}
async function readText(file) {
  const buf = await file.arrayBuffer();
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf).replace(/^﻿/, ""); }
  catch { return new TextDecoder("euc-kr").decode(buf); }
}
function canvasOf(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function toBlob(c, type, q) { return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("이미지를 만들지 못했어요")), type, q)); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("복사했어요"); }
  catch { toast("복사하지 못했어요. 직접 선택해서 복사해 주세요."); }
}

/* ───────── 저장(다운로드) ───────── */
const SAVE_OK = new Set("gif png jpg jpeg webp mp4 webm mov txt json md docx pptx epub csv ttf html svg pdf xlsx zip".split(" "));
let dlPromise = null;
function getDownloads() {
  if (!dlPromise) {
    dlPromise = (async () => {
      try { if (window.claude && typeof window.claude.use === "function") return await window.claude.use("downloads"); }
      catch (_) {}
      return null;
    })();
  }
  return dlPromise;
}
async function saveFile(name, blob) {
  const dl = await getDownloads();
  if (dl) {
    const ext = extOf(name);
    if (!SAVE_OK.has(ext)) {
      await loadScript("vendor/jszip.min.js");
      const z = new JSZip(); z.file(name, blob);
      blob = await z.generateAsync({ type: "blob" });
      name = name + ".zip";
      toast("이 미리보기 화면에서는 " + ext.toUpperCase() + " 파일을 ZIP에 담아서 저장해요");
    }
    try { await dl.save({ filename: name, data: blob }); }
    catch (e) { if (e && e.code === "declined") return; toast("저장하지 못했어요" + (e && e.message ? ": " + e.message : "")); }
    return;
  }
  const a = h("a", { href: URL.createObjectURL(blob), download: name });
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function saveAllZip(results, zipName) {
  await loadScript("vendor/jszip.min.js");
  const z = new JSZip();
  const used = new Set();

async function textToPdf(text, pt, ctx) {

    let cur = "";
    for (const ch of para) {
      if (cur && meas.measureText(cur + ch).width > maxW) {
        const sp = cur.lastIndexOf(" ");

        else { lines.push(cur); cur = ch === " " ? "" : ch; }

    }

    g.fillStyle = "#111"; g.font = px + "px " + FONT; g.textBaseline = "top";
    lines.slice(p * per, (p + 1) * per).forEach((ln, i) => g.fillText(ln, M, M + i * lh));
    g.fillStyle = "#888"; g.font = Math.round(px * 0.8) + "px " + FONT; g.textAlign = "center";
    g.fillText((p + 1) + " / " + pages, PW / 2, PH - M / 2);

  tabA.onclick = () => sw(true); tabB.onclick = () => sw(false);
  // A
  const outA = h("textarea", { id: "b64-out", readonly: true, style: "min-height:180px;font-family:var(--font-mono);font-size:12px", "aria-label": "Base64 결과" });
  const prefix = h("input", { type: "checkbox", id: "b64-prefix", checked: true });
  const infoA = h("span", { class: "note" });
  const pvA = h("div", { style: "max-width:260px" });
  let dataUrl = "", fname = "image";
  const refresh = () => { outA.value = prefix.checked ? dataUrl : dataUrl.replace(/^data:[^,]*,/, ""); infoA.textContent = dataUrl ? "글자 수 " + outA.value.length.toLocaleString() + "자" : ""; };
  prefix.onchange = refresh;
  const onFiles = fs => {
    const f = fs[0]; if (!f) return;
    fname = baseOf(f.name);
    const rd = new FileReader();
    rd.onload = () => { dataUrl = rd.result; refresh(); pvA.replaceChildren(h("div", { class: "file" }, makePreview(f, f.name), h("div", { class: "meta" }, h("span", { class: "name" }, f.name), h("span", { class: "size" }, fmtSize(f.size))))); };
    rd.readAsDataURL(f);
  };
  paneA.append(dropZone(IMG_ACCEPT, false, onFiles, "이미지를 끌어다 놓거나 눌러서 고르세요"), pvA,
    h("label", { class: "checks", for: "b64-prefix", style: "font-family:var(--font-body)" }, prefix, "data:image/… 앞부분 포함 (HTML·CSS에 바로 붙일 때)"),
    outA, h("div", { class: "actions" }, h("button", { class: "btn", onclick: () => outA.value && copyText(outA.value) }, "복사"),
      h("button", { class: "btn", onclick: () => outA.value && saveFile(fname + "-base64.txt", new Blob([outA.value], { type: "text/plain" })) }, "TXT로 저장"), infoA));
  // B
  const inB = h("textarea", { id: "b64-in", placeholder: "data:image/png;base64,… 또는 Base64 문자열을 붙여넣으세요", style: "min-height:180px;font-family:var(--font-mono);font-size:12px", "aria-label": "Base64 입력" });
  const pvB = h("div", { style: "max-width:260px" });
  const errB = h("div", { class: "errline" });
  let blobB = null, extB = "png";
  const MAGIC = [[[0x89, 0x50, 0x4e, 0x47], "png"], [[0xff, 0xd8, 0xff], "jpg"], [[0x47, 0x49, 0x46], "gif"], [[0x52, 0x49, 0x46, 0x46], "webp"], [[0x3c], "svg"], [[0x42, 0x4d], "bmp"]];
  inB.addEventListener("input", () => {
    errB.textContent = ""; pvB.replaceChildren(); blobB = null;
    let s = inB.value.trim(); if (!s) return;
    let mime = null;
    const m = s.match(/^data:([^;,]+)?(;base64)?,/); if (m) { mime = m[1]; s = s.slice(m[0].length); }
    try {
      const bin = atob(s.replace(/\s/g, "").replace(/-/g, "+").replace(/_/g, "/"));
      const u8 = Uint8Array.from(bin, c => c.charCodeAt(0));
      extB = (mime && { "image/png": "png", "image/jpeg": "jpg", "image/gif": "gif", "image/webp": "webp", "image/svg+xml": "svg", "image/bmp": "bmp" }[mime]) || (MAGIC.find(([sig]) => sig.every((b, i) => u8[i] === b)) || [, "png"])[1];
      blobB = new Blob([u8], { type: mime || "image/" + (extB === "jpg" ? "jpeg" : extB === "svg" ? "svg+xml" : extB) });
      pvB.replaceChildren(h("div", { class: "file" }, makePreview(blobB, "image." + extB), h("div", { class: "meta" }, h("span", { class: "name" }, "image." + extB), h("span", { class: "size" }, fmtSize(blobB.size)))));
    } catch { errB.textContent = "Base64 문자열이 올바르지 않아요. 앞뒤가 잘리지 않았는지 확인해 주세요."; }
  });
  paneB.append(inB, errB, pvB, h("div", { class: "actions" }, h("button", { class: "btn", onclick: () => blobB ? saveFile("image." + extB, blobB) : toast("먼저 Base64를 붙여넣어 주세요") }, "이미지 저장")));
  app.replaceChildren(h("div", { class: "tool-view" }, ...toolHeader(t), h("div", { class: "panel" }, h("div", { class: "tabs", role: "tablist" }, tabA, tabB), paneA, paneB)));
}

/* ───────── 맞춤 도구: PDF 페이지 정리 ───────── */
function pdfPagesTool(t) {
  const grid = h("div", { class: "pages" });
  const panel = h("div", { class: "panel hidden" });
  const resPanel = h("div", { class: "panel hidden" });
  const prog = progressBox();
  let file = null, pages = [];
  const save = h("button", { class: "btn primary" }, "새 PDF 만들기");
  function draw() {
    grid.replaceChildren(...pages.map((p, i) => {
      p.canvas.style.transform = "rotate(" + p.rot + "deg)" + (p.rot % 180 ? " scale(" + Math.min(p.canvas.width, p.canvas.height) / Math.max(p.canvas.width, p.canvas.height) + ")" : "");
      return h("div", { class: "page" + (p.del ? " del" : "") }, h("div", { class: "pv" }, p.canvas),
        h("div", { class: "ctrl" }, h("span", { class: "num" }, (i + 1) + (p.orig !== i ? " (원래 " + (p.orig + 1) + ")" : "")),
          h("span", { class: "actions", style: "gap:4px" },
            h("button", { class: "btn small", title: "앞으로", "aria-label": (i + 1) + "쪽 앞으로", disabled: i === 0, onclick: () => { [pages[i - 1], pages[i]] = [pages[i], pages[i - 1]]; draw(); } }, "←"),
            h("button", { class: "btn small", title: "뒤로", "aria-label": (i + 1) + "쪽 뒤로", disabled: i === pages.length - 1, onclick: () => { [pages[i + 1], pages[i]] = [pages[i], pages[i + 1]]; draw(); } }, "→"),
            h("button", { class: "btn small", title: "오른쪽으로 90도 돌리기", "aria-label": (i + 1) + "쪽 회전", onclick: () => { p.rot = (p.rot + 90) % 360; draw(); } }, "↻"),
            h("button", { class: "btn small danger", title: p.del ? "되살리기" : "지우기", "aria-label": (i + 1) + "쪽 " + (p.del ? "되살리기" : "지우기"), onclick: () => { p.del = !p.del; draw(); } }, p.del ? "↺" : "✕"))));
    }));
    const keep = pages.filter(p => !p.del).length;
    $("#pg-sum", panel).textContent = "전체 " + pages.length + "쪽 · 남길 페이지 " + keep + "쪽";
    save.disabled = !keep;
  }
  async function open(fs) {
    const f = fs.find(x => extOf(x.name) === "pdf"); if (!f) { toast("PDF 파일을 올려 주세요"); return; }
    file = f; pages = []; resPanel.classList.add("hidden");
    try {
      const doc = await openPdf(f);
      for (let i = 0; i < doc.numPages; i++) {
        prog.set("페이지 미리보기 만드는 중 (" + (i + 1) + "/" + doc.numPages + ")", i / doc.numPages);
        const pg = await doc.getPage(i + 1);
        const vp = pg.getViewport({ scale: 1 });
        pages.push({ orig: i, rot: 0, del: false, canvas: await renderPage(pg, 240 / vp.width, true) });
      }
      doc.destroy();
      panel.classList.remove("hidden"); draw();
    } catch (e) { toast(e.message); }
    prog.done();
  }
  save.addEventListener("click", async () => {
    save.disabled = true;
    try {
      const { PDFDocument, degrees } = await pdfLib();
      const src = await loadPdfLib(file);
      const out = await PDFDocument.create();
      const keep = pages.filter(p => !p.del);
      const copied = await out.copyPages(src, keep.map(p => p.orig));
      copied.forEach((pg, i) => { const r = (pg.getRotation().angle + keep[i].rot) % 360; pg.setRotation(degrees(r)); out.addPage(pg); });
      const r = { name: baseOf(file.name) + "-편집.pdf", blob: new Blob([await out.save()], { type: "application/pdf" }), info: keep.length + "쪽" };
      resPanel.replaceChildren(h("h3", null, "결과 · 저장 버튼을 눌러 받으세요"), h("div", { class: "files" }, resultCard(r)));
      resPanel.classList.remove("hidden"); resPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) { toast(e.message); }
    save.disabled = false;
  });
  panel.append(h("h3", null, h("span", { id: "pg-sum" }),
    h("span", { class: "actions" }, h("button", { class: "btn small", onclick: () => { pages.forEach(p => p.rot = (p.rot + 90) % 360); draw(); } }, "전체 회전"),
      h("button", { class: "btn small", onclick: () => { pages.sort((a, b) => a.orig - b.orig); pages.forEach(p => { p.rot = 0; p.del = false; }); draw(); } }, "처음 상태로"))),
    grid, h("div", { class: "actions" }, save));
  app.replaceChildren(h("div", { class: "tool-view" }, ...toolHeader(t), dropZone(".pdf", false, open, "정리할 PDF를 끌어다 놓거나 눌러서 고르세요"), prog.el, panel, resPanel));
}

/* ───────── 라우팅 ───────── */
let cleanup = null;
function route() {
  revokeAll();
  if (cleanup) { try { cleanup(); } catch (_) {} cleanup = null; }
  document.querySelectorAll(".modal").forEach(m => m.remove());
  const id = location.hash.slice(1);
  const t = TOOLS.find(x => x.id === id);
  if (!t) { renderHome(); return; }
  document.title = t.fmt + " · 바꿈";
  if (t.custom) t.custom(t); else renderFileTool(t);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
document.addEventListener("paste", e => {
  const fs = [...(e.clipboardData && e.clipboardData.files || [])];
  const inp = $("#file-input");
  if (fs.length && inp && !/TEXTAREA|INPUT/.test(document.activeElement.tagName)) { const dt = new DataTransfer(); fs.forEach(f => dt.items.add(f)); inp.files = dt.files; inp.dispatchEvent(new Event("change")); }
});
route();
getDownloads();
</script>
</body>
